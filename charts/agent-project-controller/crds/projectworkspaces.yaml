apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projectworkspaces.projects.agentwork.dev
spec:
  group: projects.agentwork.dev
  scope: Namespaced
  names:
    plural: projectworkspaces
    singular: projectworkspace
    kind: ProjectWorkspace
    shortNames: [pw]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repository
          type: string
          jsonPath: .spec.repository
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [repository, desiredState]
              x-kubernetes-validations:
                - rule: self.repository == oldSelf.repository
                  message: Repository is immutable; request a new workspace.
                - rule: "(has(self.https) == has(oldSelf.https) && (!has(self.https) || self.https == oldSelf.https)) || (oldSelf.desiredState == 'Paused' && self.desiredState == 'Paused')"
                  message: Pause the workspace before editing HTTPS policy; it must stay paused during the update.
                - rule: "oldSelf.desiredState != 'Removed' || self.desiredState == 'Removed'"
                  message: Removal is terminal; request a new workspace.
              properties:
                repository:
                  type: string
                  maxLength: 201
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
                desiredState:
                  type: string
                  enum: [Running, Paused, Removed]
                  default: Running
                https:
                  type: array
                  maxItems: 63
                  items:
                    type: object
                    required: [host, methods, paths]
                    properties:
                      host:
                        type: string
                        maxLength: 253
                        pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                      methods:
                        type: array
                        minItems: 1
                        maxItems: 7
                        items:
                          type: string
                          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
                      paths:
                        type: array
                        minItems: 1
                        maxItems: 64
                        items:
                          type: string
                          minLength: 1
                          maxLength: 512
                          pattern: '^/'
            status:
              type: object
              properties:
                phase:
                  type: string
                namespace:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                audit:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [time, action, generation]
                    properties:
                      time:
                        type: string
                        format: date-time
                      action:
                        type: string
                      generation:
                        type: integer
                        format: int64
