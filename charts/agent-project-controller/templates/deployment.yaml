apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-project-controller
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (dict "config" .Values.config "workspaceImage" .Values.workspaceImage "proxyImage" (default .Values.controllerImage .Values.proxyImage) "workspaceScheduling" .Values.workspaceScheduling "proxyScheduling" .Values.proxyScheduling "proxyGateway" .Values.proxyGateway) | sha256sum }}
      labels:
        app.kubernetes.io/name: agent-project-controller
    spec:
      serviceAccountName: controller
      dnsPolicy: {{ .Values.controllerDNS.policy | quote }}
{{- with .Values.controllerDNS.config }}
      dnsConfig:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerScheduling.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerScheduling.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerScheduling.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerImagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ required "controllerImage must be a digest-pinned image" .Values.controllerImage | quote }}
          args: [controller]
          envFrom:
            - configMapRef:
                name: controller-config
          env:
            - name: FORGEJO_TOKEN_FILE
              value: /control-secrets/forgejo-token
            - name: OIDC_CLIENT_SECRET_FILE
              value: /control-secrets/oidc-client-secret
{{- if .Values.automationAPI.enabled }}
            - name: API_SECRET_FILE
              value: /control-secrets/api-secret
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
{{ toYaml .Values.controllerResources | indent 12 }}
          volumeMounts:
            - name: control-secrets
              mountPath: /control-secrets
              readOnly: true
      volumes:
        - name: control-secrets
          secret:
            secretName: {{ .Values.existingSecret | quote }}
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-project-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
