# Published 0.1.0-alpha.1 images for charts/agent-project-controller.
# Built from 6d754c47f223edbe5bfff399405fb1450abb0c4b. Current main adds
# workspace-image replacement, an experimental NetworkPolicy provider, and
# an optional GitHub project host. Those behaviors are not in these images.
# GitHub hosting is documented in github-values.yaml and needs its own build.
#
# Replace the Forgejo origin, owner, runtime class, storage class, public
# origin and OIDC client before installing. Create Secret controller-secrets
# separately. This chart does not install Agent Sandbox, Cilium, gVisor,
# Forgejo or an identity provider.
#
# DNS_DIRECT_ENDPOINTS is true for the qualified gVisor profile.
# DNS_SERVICE_NAME kube-dns is the Kubernetes default; change it when CoreDNS
# uses another Service name. Leave proxyGateway empty when Forgejo is reached
# as ordinary public HTTPS. An in-cluster TLS gateway needs the exception in
# gvisor-values.yaml. Keep NETWORK_PROVIDER on cilium until a non-Cilium
# dataplane has been qualified.
controllerImage: ghcr.io/skippysteve/agent-project-controller@sha256:084fdfa09f04a279d6ea11bf168222e388f9f5230ddda38a62dcade5f9b9b9d3
workspaceImage: ghcr.io/skippysteve/agent-project-workspace@sha256:caf59a3dac5b216aa670f02cc4db857cf7b214d346fc844722f7a7c602ba9892
# proxyImage defaults to controllerImage.
existingSecret: controller-secrets
automationAPI:
  enabled: false
config:
  NETWORK_PROVIDER: cilium
  FORGEJO_ORIGIN: https://git.example.com
  FORGEJO_OWNER: owner
  RUNTIME_CLASS: agent-gvisor
  STORAGE_CLASS: local-path
  STORAGE_SIZE: 10Gi
  CLUSTER_DOMAIN: cluster.local
  DNS_SERVICE_NAMESPACE: kube-system
  DNS_SERVICE_NAME: kube-dns
  DNS_DIRECT_ENDPOINTS: 'true'
  PUBLIC_ORIGIN: https://projects.example.com
  OIDC_ISSUER: https://auth.example.com/application/o/agent-project-controller/
  OIDC_CLIENT_ID: replace-with-the-public-client-id
  OIDC_GROUPS_CLAIM: groups
  OIDC_ALLOWED_GROUPS: agent-project-operators
  OIDC_SCOPES: profile,groups
  ALLOW_STATIC_LOGIN: 'false'
  OTEL_ENABLED: 'false'
