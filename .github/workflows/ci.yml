name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.0.0
      - name: Install Kubernetes test API server
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.0.0-20260125163108-a19ec76a3c5d
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.34.1 -p path)" >> "$GITHUB_ENV"
      - name: Go race tests, vet and Helm qualification
        run: |
          make test vet build
          APC_HELM_TEST=true go test -count=1 ./internal/installation
      - name: Operator and T3 denial tests
        run: |
          python3 -m venv /tmp/apc-tests
          /tmp/apc-tests/bin/pip install -r scripts/requirements-recovery.txt
          /tmp/apc-tests/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          /tmp/apc-tests/bin/python -m unittest discover -s internal/t3 -p 'test_*.py' -v
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Package release candidate
        run: make release VERSION=0.1.0-alpha.1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alpha-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, workspace]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build exact candidate image
        run: |
          docker buildx build --platform linux/amd64 --target "${{ matrix.target }}" \
            --build-arg VERSION=0.1.0-alpha.1 --build-arg SOURCE_REVISION="${{ github.sha }}" \
            --cache-from type=gha,scope=${{ matrix.target }} --cache-to type=gha,mode=max,scope=${{ matrix.target }} \
            --load --tag apc-candidate:${{ matrix.target }} .
          docker image inspect apc-candidate:${{ matrix.target }} > image-${{ matrix.target }}.json
          docker run --rm apc-candidate:${{ matrix.target }} version
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: apc-candidate:${{ matrix.target }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ matrix.target }}-${{ github.sha }}
          path: |
            image-${{ matrix.target }}.json
            sbom-${{ matrix.target }}.spdx.json
          if-no-files-found: error
