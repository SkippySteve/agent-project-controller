name: Publish images
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build, such as a release tag
        required: true
        default: 0.1.0-alpha.1
      version:
        description: Image version tag
        required: true
        default: 0.1.0-alpha.1
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image: agent-project-controller
          - target: workspace
            image: agent-project-workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
      - id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'value=%s\n' "$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            printf 'value=%s\n' "$REF_NAME" >> "$GITHUB_OUTPUT"
          fi
      - id: image
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            SOURCE_REVISION=${{ steps.source.outputs.revision }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:${{ steps.source.outputs.revision }}
      - name: Link the package to this public repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method PATCH "/user/packages/container/${{ matrix.image }}" -f visibility=public
