apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-project-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-project-controller
    spec:
      serviceAccountName: controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: agent-project-controller:dev
          args: [controller]
          envFrom:
            - configMapRef:
                name: controller-config
          env:
            - name: FORGEJO_TOKEN_FILE
              value: /control-secrets/forgejo-token
            - name: OIDC_CLIENT_SECRET_FILE
              value: /control-secrets/oidc-client-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 512Mi
          volumeMounts:
            - name: control-secrets
              mountPath: /control-secrets
              readOnly: true
      volumes:
        - name: control-secrets
          secret:
            secretName: controller-secrets
            defaultMode: 0440
---
apiVersion: v1
kind: Service
metadata:
  name: controller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-project-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
